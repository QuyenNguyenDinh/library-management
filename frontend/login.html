<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện - Đăng Nhập Thủ Thư</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            max-width: 420px;
            width: 100%;
            padding: 35px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <div class="p-3 bg-primary bg-opacity-10 text-primary rounded-circle d-inline-block mb-3">
                <i class="bi bi-shield-lock-fill fs-1"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Đăng Nhập Thủ Thư</h4>
            <p class="text-muted small">Cổng thông tin quản trị thư viện</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-semibold">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" class="form-control" placeholder="Nhập tài khoản (admin)" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu (admin123)" required>
                </div>
            </div>

            <div class="p-2 bg-light rounded text-muted small mb-3">
                <i class="bi bi-info-circle me-1"></i>Tài khoản mặc định: <strong>admin</strong> | Mật khẩu: <strong>admin123</strong> (Được mã hóa băm SHA-256).
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="loginBtn">
                <i class="bi bi-box-arrow-in-right me-1"></i>Đăng Nhập
            </button>
        </form>

        <div id="loginAlert" class="mt-3" style="display: none;"></div>
        
        <div class="text-center mt-4 pt-2 border-top">
            <a href="borrow.html" class="text-decoration-none small text-secondary">
                <i class="bi bi-arrow-left me-1"></i>Vào thẳng màn hình Mượn/Trả Sách
            </a>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:8080/api";

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('loginAlert');
            const loginBtn = document.getElementById('loginBtn');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang xác thực...';

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                alertBox.style.display = 'block';

                if (response.ok && data.success) {
                    alertBox.className = 'alert alert-success small p-2 text-center';
                    alertBox.innerHTML = `<i class="bi bi-check-circle me-1"></i>${data.message} Đang chuyển hướng...`;
                    localStorage.setItem('adminUser', JSON.stringify(data.data));
                    setTimeout(() => {
                        window.location.href = 'borrow.html';
                    }, 1000);
                } else {
                    alertBox.className = 'alert alert-danger small p-2 text-center';
                    alertBox.innerHTML = `<i class="bi bi-exclamation-triangle me-1"></i>${data.message || 'Đăng nhập thất bại!'}`;
                }
            } catch (err) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-warning small p-2 text-center';
                alertBox.innerHTML = 'Không thể kết nối đến máy chủ. Hãy chắc chắn Server đã được khởi chạy!';
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i>Đăng Nhập';
            }
        });
    </script>
</body>
</html>
