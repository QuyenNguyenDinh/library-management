<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện - Nghiệp vụ Mượn Sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        .header-bg { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark header-bg shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-book-half me-2"></i>QUẢN LÝ THƯ VIỆN</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active fw-semibold" href="borrow.html"><i class="bi bi-box-arrow-right me-1"></i>Mượn Sách</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="return.html"><i class="bi bi-box-arrow-in-left me-1"></i>Trả Sách</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card card-custom p-4">
                    <div class="d-flex align-items-center mb-3">
                        <div class="p-3 bg-primary bg-opacity-10 text-primary rounded-3 me-3">
                            <i class="bi bi-journal-plus fs-3"></i>
                        </div>
                        <div>
                            <h4 class="mb-1 fw-bold text-dark">Lập Phiếu Mượn Sách</h4>
                            <p class="text-muted mb-0 small">Hỗ trợ kiểm tra 5 điều kiện mượn & demo mượn nhiều sách</p>
                        </div>
                    </div>
                    <hr>

                    <form id="borrowForm">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Mã Bạn đọc <span class="text-danger">*</span></label>
                                <input type="text" id="readerId" class="form-control" placeholder="VD: RD001" required>
                                <div class="form-text">SV thường (RD001, max 3) | SV ưu tiên (RD002, max 5) | Giảng viên (RD003, max 10)</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Ngày mượn (Demo)</label>
                                <input type="date" id="borrowDate" class="form-control">
                            </div>
                        </div>

                        <h6 class="fw-bold mt-4 mb-2"><i class="bi bi-bookshelf me-2"></i>Danh sách sách muốn mượn</h6>
                        <div id="booksContainer">
                            <div class="row g-2 align-items-center mb-2 book-item">
                                <div class="col-7">
                                    <input type="text" class="form-control book-id" placeholder="Mã sách (VD: BK001, BK002)" required>
                                </div>
                                <div class="col-3">
                                    <input type="number" class="form-control book-qty" min="1" value="1" placeholder="Số lượng" required>
                                </div>
                                <div class="col-2">
                                    <button type="button" class="btn btn-outline-danger w-100 disabled"><i class="bi bi-trash"></i></button>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <button type="button" class="btn btn-outline-secondary btn-sm" id="addBookBtn">
                                <i class="bi bi-plus-circle me-1"></i>Thêm đầu sách khác
                            </button>
                            <span class="text-muted small">Thời hạn mượn mặc định: 14 ngày</span>
                        </div>

                        <div class="mt-4 pt-3 border-top d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4 fw-semibold" id="submitBtn">
                                <i class="bi bi-check2-circle me-1"></i>Xác nhận Mượn Sách
                            </button>
                            <button type="reset" class="btn btn-light px-3">Làm lại</button>
                        </div>
                    </form>

                    <!-- Alert message box -->
                    <div id="resultBox" class="mt-4" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:8080/api";

        // Tự động gán ngày hôm nay
        document.getElementById('borrowDate').value = new Date().toISOString().split('T')[0];

        // Thêm dòng sách
        document.getElementById('addBookBtn').addEventListener('click', () => {
            const container = document.getElementById('booksContainer');
            const newRow = document.createElement('div');
            newRow.className = 'row g-2 align-items-center mb-2 book-item';
            newRow.innerHTML = `
                <div class="col-7">
                    <input type="text" class="form-control book-id" placeholder="Mã sách (VD: BK002)" required>
                </div>
                <div class="col-3">
                    <input type="number" class="form-control book-qty" min="1" value="1" placeholder="Số lượng" required>
                </div>
                <div class="col-2">
                    <button type="button" class="btn btn-outline-danger w-100 remove-btn"><i class="bi bi-trash"></i></button>
                </div>
            `;
            container.appendChild(newRow);
            newRow.querySelector('.remove-btn').addEventListener('click', () => newRow.remove());
        });

        // Xử lý gửi form mượn sách
        document.getElementById('borrowForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultBox = document.getElementById('resultBox');
            const submitBtn = document.getElementById('submitBtn');

            const readerId = document.getElementById('readerId').value.trim();
            const borrowDate = document.getElementById('borrowDate').value;

            const bookItems = document.querySelectorAll('.book-item');
            if (bookItems.length === 0) return;

            const firstBookId = bookItems[0].querySelector('.book-id').value.trim();
            const firstQty = parseInt(bookItems[0].querySelector('.book-qty').value, 10);

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang xử lý...';

            try {
                const response = await fetch(`${API_BASE}/borrow`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        readerId: readerId,
                        bookId: firstBookId,
                        quantity: firstQty,
                        borrowDate: borrowDate
                    })
                });

                const resData = await response.json();
                resultBox.style.display = 'block';

                if (response.ok && resData.success) {
                    resultBox.className = 'alert alert-success mt-4 p-3 border-0 shadow-sm';
                    resultBox.innerHTML = `
                        <h6 class="alert-heading fw-bold"><i class="bi bi-check-circle-fill me-2"></i>Mượn sách thành công!</h6>
                        <p class="mb-1"><strong>Mã phiếu mượn:</strong> <span class="badge bg-success">${resData.data.ticketId}</span></p>
                        <p class="mb-1"><strong>Bạn đọc:</strong> ${resData.data.readerId} | <strong>Mã sách:</strong> ${resData.data.bookId} (${resData.data.quantity} cuốn)</p>
                        <p class="mb-0 small text-muted">Ngày mượn: ${resData.data.borrowDate} - Hạn trả: <strong>${resData.data.dueDate}</strong></p>
                    `;
                } else {
                    resultBox.className = 'alert alert-danger mt-4 p-3 border-0 shadow-sm';
                    resultBox.innerHTML = `
                        <h6 class="alert-heading fw-bold"><i class="bi bi-exclamation-triangle-fill me-2"></i>Mượn sách thất bại!</h6>
                        <p class="mb-0">${resData.message || 'Không thể tạo phiếu mượn.'}</p>
                    `;
                }
            } catch (err) {
                resultBox.style.display = 'block';
                resultBox.className = 'alert alert-warning mt-4 p-3 border-0 shadow-sm';
                resultBox.innerHTML = `<strong>Lỗi kết nối:</strong> Không thể kết nối tới Backend tại ${API_BASE}. Hãy chắc chắn Server Java đang chạy!`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-check2-circle me-1"></i>Xác nhận Mượn Sách';
            }
        });
    </script>
</body>
</html>
